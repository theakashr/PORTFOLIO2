<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f1d"/>
      <stop offset="50%" stop-color="#14172b"/>
      <stop offset="100%" stop-color="#1e1b38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="14" fill="url(#bg)"/>

  <!-- Subtle Career & Data Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="0.75">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="110" r="95" fill="#6366f1" opacity="0.1"/>
  <circle cx="120" cy="390" r="85" fill="#ec4899" opacity="0.08"/>

  <!-- Top Accent Bar -->
  <rect x="80" y="80" width="70" height="4" rx="2" fill="url(#accent)"/>

  <!-- Stylized Resume Document Silhouette in Center -->
  <g transform="translate(400, 130)" opacity="0.2">
    <!-- Document outline -->
    <rect x="-45" y="-35" width="90" height="65" rx="6" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    <!-- Folded corner / Header line -->
    <line x1="-30" y1="-20" x2="10" y2="-20" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="2" x2="25" y2="2" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-30" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Horizontal Laser Scan Line (ATS Scanning Motif) -->
  <line x1="150" y1="180" x2="650" y2="180" stroke="url(#scanGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main Title -->
  <text x="400" y="240" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1.5" filter="url(#glow)">AI Resume Builder</text>

  <!-- Dynamic Gradient Underline -->
  <rect x="230" y="260" width="340" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="400" y="302" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="500" font-size="16" fill="#cbd5e1" opacity="0.85" letter-spacing="3.5">ATS OPTIMIZER &amp; MOCK INTERVIEW SUITE</text>

  <!-- Badge / Tag Pills -->
  <g transform="translate(180, 345)">
    <rect x="0" y="0" width="95" height="28" rx="14" fill="#6366f1" opacity="0.18"/>
    <text x="47.5" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a5b4fc" font-weight="600">Next.js</text>
    
    <rect x="105" y="0" width="105" height="28" rx="14" fill="#6366f1" opacity="0.18"/>
    <text x="157.5" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#a5b4fc" font-weight="600">Gemini AI</text>
    
    <rect x="220" y="0" width="100" height="28" rx="14" fill="#ec4899" opacity="0.18"/>
    <text x="270" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f472b6" font-weight="600">Supabase</text>
    
    <rect x="330" y="0" width="110" height="28" rx="14" fill="#ec4899" opacity="0.18"/>
    <text x="385" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#f472b6" font-weight="600">ATS Match</text>
  </g>

  <!-- Technical Corner Brackets -->
  <path d="M0,0 L40,0 L40,3 L3,3 L3,40 L0,40 Z" fill="#6366f1" opacity="0.4" transform="translate(24,24)"/>
  <path d="M0,0 L40,0 L40,3 L3,3 L3,40 L0,40 Z" fill="#ec4899" opacity="0.4" transform="translate(776,476) rotate(180)"/>
</svg>
