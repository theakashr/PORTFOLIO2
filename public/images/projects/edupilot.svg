<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  <!-- Decorative circle -->
  <circle cx="650" cy="120" r="80" fill="#dc2626" opacity="0.08"/>
  <circle cx="150" cy="400" r="60" fill="#dc2626" opacity="0.06"/>
  <!-- Accent bar -->
  <rect x="80" y="160" width="60" height="4" rx="2" fill="url(#accent)"/>
  <!-- Book / Graduation Icon -->
  <g transform="translate(400, 150)" opacity="0.15">
    <!-- Open book shape -->
    <path d="M-60,20 Q-60,-20 0,-30 Q60,-20 60,20 L60,60 Q60,30 0,25 Q-60,30 -60,60 Z" fill="none" stroke="#dc2626" stroke-width="3"/>
    <!-- Graduation cap -->
    <polygon points="0,-55 -40,-35 0,-15 40,-35" fill="#dc2626" opacity="0.6"/>
    <line x1="0" y1="-15" x2="0" y2="5" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="8" r="3" fill="#dc2626" opacity="0.6"/>
  </g>
  <!-- Main title -->
  <text x="400" y="235" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="62" fill="#ffffff" letter-spacing="2" filter="url(#glow)">EduPilot AI</text>
  <!-- Red underline -->
  <rect x="270" y="255" width="260" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="400" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="20" fill="#ffffff" opacity="0.7" letter-spacing="4">ADAPTIVE LEARNING PLATFORM</text>
  <!-- Bottom tag pills -->
  <rect x="240" y="350" width="80" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="280" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">React</text>
  <rect x="335" y="350" width="60" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="365" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">AI</text>
  <rect x="410" y="350" width="100" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="460" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">Education</text>
  <!-- Corner accents -->
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(20,20)"/>
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(780,480) rotate(180)"/>
</svg>