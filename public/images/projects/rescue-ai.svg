<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Radar sweep -->
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  <!-- Radar circles -->
  <g transform="translate(620, 130)" opacity="0.12">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#dc2626" stroke-width="1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#dc2626" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#dc2626" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#dc2626"/>
  </g>
  <!-- Subtle topographic lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.8" fill="none">
    <ellipse cx="300" cy="350" rx="200" ry="80"/>
    <ellipse cx="300" cy="350" rx="250" ry="100"/>
    <ellipse cx="300" cy="350" rx="300" ry="120"/>
    <ellipse cx="300" cy="350" rx="350" ry="140"/>
  </g>
  <!-- Accent bar -->
  <rect x="80" y="160" width="60" height="4" rx="2" fill="url(#accent)"/>
  <!-- Map pin icon -->
  <g transform="translate(400, 135)" opacity="0.15">
    <path d="M0,-50 C-25,-50 -40,-30 -40,-10 C-40,20 0,50 0,50 C0,50 40,20 40,-10 C40,-30 25,-50 0,-50 Z" fill="none" stroke="#dc2626" stroke-width="3"/>
    <circle cx="0" cy="-12" r="12" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <!-- Signal waves -->
    <path d="M50,-20 Q65,-20 65,0" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>
    <path d="M55,-30 Q78,-30 78,5" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Main title -->
  <text x="400" y="235" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="62" fill="#ffffff" letter-spacing="2" filter="url(#glow)">Rescue AI</text>
  <!-- Red underline -->
  <rect x="280" y="255" width="240" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="400" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="20" fill="#ffffff" opacity="0.7" letter-spacing="4">DISASTER RESPONSE SYSTEM</text>
  <!-- Bottom tag pills -->
  <rect x="220" y="350" width="90" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="265" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">Python</text>
  <rect x="325" y="350" width="70" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="360" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">GIS</text>
  <rect x="410" y="350" width="80" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="450" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">Real-time</text>
  <!-- Corner accents -->
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(20,20)"/>
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(780,480) rotate(180)"/>
</svg>