<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2e0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bg)"/>
  <!-- Sound wave rings -->
  <g transform="translate(650, 140)" opacity="0.08">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#dc2626" stroke-width="1"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#dc2626" stroke-width="0.5"/>
  </g>
  <!-- Audio waveform bars (equalizer style) -->
  <g transform="translate(100, 380)" opacity="0.08">
    <rect x="0" y="-30" width="6" height="60" rx="3" fill="#dc2626"/>
    <rect x="14" y="-50" width="6" height="100" rx="3" fill="#dc2626"/>
    <rect x="28" y="-20" width="6" height="40" rx="3" fill="#dc2626"/>
    <rect x="42" y="-60" width="6" height="120" rx="3" fill="#dc2626"/>
    <rect x="56" y="-35" width="6" height="70" rx="3" fill="#dc2626"/>
    <rect x="70" y="-45" width="6" height="90" rx="3" fill="#dc2626"/>
    <rect x="84" y="-25" width="6" height="50" rx="3" fill="#dc2626"/>
    <rect x="98" y="-55" width="6" height="110" rx="3" fill="#dc2626"/>
    <rect x="112" y="-30" width="6" height="60" rx="3" fill="#dc2626"/>
  </g>
  <!-- Right side equalizer -->
  <g transform="translate(600, 390)" opacity="0.06">
    <rect x="0" y="-25" width="6" height="50" rx="3" fill="#dc2626"/>
    <rect x="14" y="-40" width="6" height="80" rx="3" fill="#dc2626"/>
    <rect x="28" y="-15" width="6" height="30" rx="3" fill="#dc2626"/>
    <rect x="42" y="-50" width="6" height="100" rx="3" fill="#dc2626"/>
    <rect x="56" y="-30" width="6" height="60" rx="3" fill="#dc2626"/>
    <rect x="70" y="-45" width="6" height="90" rx="3" fill="#dc2626"/>
    <rect x="84" y="-20" width="6" height="40" rx="3" fill="#dc2626"/>
  </g>
  <!-- Accent bar -->
  <rect x="80" y="160" width="60" height="4" rx="2" fill="url(#accent)"/>
  <!-- Music note icon -->
  <g transform="translate(400, 120)" opacity="0.15">
    <!-- Beamed eighth notes -->
    <circle cx="-25" cy="25" r="12" fill="#dc2626"/>
    <circle cx="25" cy="15" r="12" fill="#dc2626"/>
    <line x1="-13" y1="25" x2="-13" y2="-35" stroke="#dc2626" stroke-width="3"/>
    <line x1="37" y1="15" x2="37" y2="-45" stroke="#dc2626" stroke-width="3"/>
    <line x1="-13" y1="-35" x2="37" y2="-45" stroke="#dc2626" stroke-width="4"/>
    <line x1="-13" y1="-28" x2="37" y2="-38" stroke="#dc2626" stroke-width="3"/>
  </g>
  <!-- Main title -->
  <text x="400" y="235" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="62" fill="#ffffff" letter-spacing="3" filter="url(#glow)">Harmoniq</text>
  <!-- Red underline -->
  <rect x="265" y="255" width="270" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Subtitle -->
  <text x="400" y="300" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="20" fill="#ffffff" opacity="0.7" letter-spacing="4">KANNADA MUSIC STREAMING</text>
  <!-- Bottom tag pills -->
  <rect x="220" y="350" width="80" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="260" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">React</text>
  <rect x="315" y="350" width="90" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="360" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">Kannada</text>
  <rect x="420" y="350" width="110" height="28" rx="14" fill="#dc2626" opacity="0.15"/>
  <text x="475" y="369" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="600">Streaming</text>
  <!-- Corner accents -->
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(20,20)"/>
  <path d="M0,0 L50,0 L50,4 L4,4 L4,50 L0,50 Z" fill="#dc2626" opacity="0.3" transform="translate(780,480) rotate(180)"/>
</svg>